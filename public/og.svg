<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Ambient Aurora Orbs -->
    <radialGradient id="aurora1" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora3" cx="60%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Linear Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glowing Auroras -->
  <circle cx="350" cy="200" r="450" fill="url(#aurora1)"/>
  <circle cx="950" cy="450" r="400" fill="url(#aurora2)"/>
  <circle cx="700" cy="150" r="350" fill="url(#aurora3)"/>

  <!-- Subtle Micro-dot Grid -->
  <g opacity="0.15" fill="#94a3b8">
    <!-- Grid dots pattern sample -->
    <pattern id="dotGrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#dotGrid)"/>
  </g>

  <!-- Central Glass Card Container -->
  <rect x="100" y="80" width="1000" height="470" rx="36" fill="#0f172a" fill-opacity="0.55" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Terminal / Pill Header -->
  <g transform="translate(160, 140)">
    <rect width="200" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <circle cx="24" cy="19" r="5" fill="#10b981"/>
    <text x="38" y="24" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="1">me.hrtk92.dev</text>
  </g>

  <!-- Title / Name -->
  <g transform="translate(160, 245)">
    <text fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5">
      Hi, I'm <tspan fill="url(#textGrad)">Takuho</tspan>.
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(160, 310)">
    <text fill="#cbd5e1" font-family="'Zen Maru Gothic', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="26" font-weight="500">
      Developer crafting modern web experiences &amp; OSS.
    </text>
  </g>

  <!-- Tech Badges -->
  <g transform="translate(160, 375)">
    <!-- Badge 1: TypeScript -->
    <rect x="0" y="0" width="140" height="42" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    <text x="70" y="26" fill="#e2e8f0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">TypeScript</text>

    <!-- Badge 2: Python -->
    <rect x="154" y="0" width="115" height="42" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    <text x="211" y="26" fill="#e2e8f0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Python</text>

    <!-- Badge 3: Cloudflare -->
    <rect x="283" y="0" width="135" height="42" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    <text x="350" y="26" fill="#e2e8f0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Cloudflare</text>

    <!-- Badge 4: Self-Hosted -->
    <rect x="432" y="0" width="145" height="42" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    <text x="504" y="26" fill="#e2e8f0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Self-Hosted</text>
  </g>

  <!-- Footer Branding inside Card -->
  <g transform="translate(160, 480)">
    <text fill="#64748b" font-family="'Plus Jakarta Sans', system-ui, monospace" font-size="14" font-weight="500">
      Portfolio &amp; Work Archive · Saitama, JP
    </text>
  </g>
</svg>
